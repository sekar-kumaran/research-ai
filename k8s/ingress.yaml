apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research-ai
  namespace: research-ai
spec:
  ingressClassName: nginx
  rules:
    - host: research-ai.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: research-ai-backend
                port:
                  name: http