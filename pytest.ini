[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    -m "not requires_artifacts and not slow"
markers =
    requires_artifacts: marks tests that need built FAISS/ML artifacts
    slow: marks tests as slow running (latency benchmarks)
