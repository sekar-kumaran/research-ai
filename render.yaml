services:
  - type: web
    name: research-ai-orchestrator
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HF_SPACE_ID
        sync: false  # You will enter this in the Render Dashboard (e.g., sekarkumaran461/research-ai)
      - key: CLOUD_LLM_PROVIDER
        value: gemini # or groq, openrouter, etc.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ENABLE_PYTHON_EXECUTION
        value: "false" # Keep false for public web deployment
